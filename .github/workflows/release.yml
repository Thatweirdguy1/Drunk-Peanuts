name: Build desktop downloads

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: Windows-x64
          - os: macos-15-intel
            name: macOS-Intel
          - os: macos-15
            name: macOS-Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run checks
        run: python -m unittest -q
      - name: Install VLC runtime on Windows
        if: runner.os == 'Windows'
        run: choco install vlc --yes --no-progress
      - name: Install VLC runtime on macOS
        if: runner.os == 'macOS'
        run: brew install --cask vlc
      - name: Package app on Windows
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name LocalFileConverter --icon assets/app.ico --version-file version_info.txt --add-data "assets;assets" --collect-all imageio_ffmpeg --collect-data rapidocr --add-data "ocr_models;ocr_models" --add-data "C:/Program Files/VideoLAN/VLC/libvlc.dll;vlc_runtime" --add-data "C:/Program Files/VideoLAN/VLC/libvlccore.dll;vlc_runtime" --add-data "C:/Program Files/VideoLAN/VLC/plugins;vlc_runtime/plugins" app.py
      - name: Package app on macOS
        if: runner.os == 'macOS'
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name LocalFileConverter --add-data "assets:assets" --collect-all imageio_ffmpeg --collect-data rapidocr --add-data "ocr_models:ocr_models" --add-binary "/Applications/VLC.app/Contents/MacOS/lib:vlc_runtime/lib" --add-binary "/Applications/VLC.app/Contents/MacOS/plugins:vlc_runtime/plugins" app.py
      - name: Use Windows ICU for Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # PyInstaller may pick up an incompatible icuuc.dll from another app on PATH.
          Remove-Item -LiteralPath dist/LocalFileConverter/_internal/icuuc.dll -ErrorAction SilentlyContinue
      - name: Rebuild bundled VLC plugin cache
        if: runner.os == 'Windows'
        run: python prepare_vlc_runtime.py dist/LocalFileConverter
      - name: Verify packaged OCR on Windows
        if: runner.os == 'Windows'
        run: python verify_release_ocr.py dist/LocalFileConverter/LocalFileConverter.exe
      - name: Verify packaged OCR on macOS
        if: runner.os == 'macOS'
        run: python verify_release_ocr.py dist/LocalFileConverter.app/Contents/MacOS/LocalFileConverter
      - name: Verify native workspaces on Windows
        if: runner.os == 'Windows'
        run: python verify_release_suite.py dist/LocalFileConverter/LocalFileConverter.exe
      - name: Verify native workspaces on macOS
        if: runner.os == 'macOS'
        run: python verify_release_suite.py dist/LocalFileConverter.app/Contents/MacOS/LocalFileConverter
      - name: Verify native conversion on Windows
        if: runner.os == 'Windows'
        run: python verify_release_native.py dist/LocalFileConverter/LocalFileConverter.exe
      - name: Verify native conversion on macOS
        if: runner.os == 'macOS'
        run: python verify_release_native.py dist/LocalFileConverter.app/Contents/MacOS/LocalFileConverter
      - name: Verify optional renderer support on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path dist/LocalFileConverter/LocalFileConverter.exe).Path -ArgumentList '--renderer-self-check' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Verify optional renderer support on macOS
        if: runner.os == 'macOS'
        run: dist/LocalFileConverter.app/Contents/MacOS/LocalFileConverter --renderer-self-check
      - name: Include licenses on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md -Destination dist/LocalFileConverter
          Copy-Item THIRD_PARTY_LICENSES -Destination dist/LocalFileConverter -Recurse
          Copy-Item THIRD_PARTY_LICENSES/VLC-GPL-2.0.txt -Destination dist/LocalFileConverter/VLC-COPYING.txt
      - name: Include licenses on macOS
        if: runner.os == 'macOS'
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md dist/LocalFileConverter.app/Contents/Resources/
          cp -R THIRD_PARTY_LICENSES dist/LocalFileConverter.app/Contents/Resources/
          cp THIRD_PARTY_LICENSES/VLC-GPL-2.0.txt dist/LocalFileConverter.app/Contents/Resources/VLC-COPYING.txt
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is missing from the Windows runner.' }
          & $compiler.FullName /DPackageDir=dist\LocalFileConverter installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/FreeConvert-*-Setup.exe -Destination .
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath dist/LocalFileConverter -DestinationPath "LocalFileConverter-${{ matrix.name }}.zip"
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/LocalFileConverter.app "LocalFileConverter-${{ matrix.name }}.zip"
      - name: Checksum Windows downloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-FileHash "LocalFileConverter-${{ matrix.name }}.zip", FreeConvert-*-Setup.exe | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content "SHA256SUMS-${{ matrix.name }}.txt" -Encoding ascii
      - name: Checksum macOS download
        if: runner.os == 'macOS'
        run: shasum -a 256 "LocalFileConverter-${{ matrix.name }}.zip" > "SHA256SUMS-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            LocalFileConverter-${{ matrix.name }}.zip
            FreeConvert-*-Setup.exe
            SHA256SUMS-${{ matrix.name }}.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" ./*.zip ./*.exe SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --title "FreeConvert ${GITHUB_REF_NAME}" --verify-tag --notes-file RELEASE_NOTES.md --draft
