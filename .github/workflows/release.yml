name: Build desktop downloads

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: Windows-x64
          - os: macos-15-intel
            name: macOS-Intel
          - os: macos-15
            name: macOS-Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run checks
        run: python -m unittest -q
      - name: Package app
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name LocalFileConverter --collect-all imageio_ffmpeg --collect-data rapidocr app.py
      - name: Use Windows ICU for Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # PyInstaller may pick up an incompatible icuuc.dll from another app on PATH.
          Remove-Item -LiteralPath dist/LocalFileConverter/_internal/icuuc.dll -ErrorAction SilentlyContinue
      - name: Verify packaged OCR on Windows
        if: runner.os == 'Windows'
        run: python verify_release_ocr.py dist/LocalFileConverter/LocalFileConverter.exe
      - name: Verify packaged OCR on macOS
        if: runner.os == 'macOS'
        run: python verify_release_ocr.py dist/LocalFileConverter.app/Contents/MacOS/LocalFileConverter
      - name: Verify native workspaces on Windows
        if: runner.os == 'Windows'
        run: python verify_release_suite.py dist/LocalFileConverter/LocalFileConverter.exe
      - name: Verify native workspaces on macOS
        if: runner.os == 'macOS'
        run: python verify_release_suite.py dist/LocalFileConverter.app/Contents/MacOS/LocalFileConverter
      - name: Verify native conversion on Windows
        if: runner.os == 'Windows'
        run: python verify_release_native.py dist/LocalFileConverter/LocalFileConverter.exe
      - name: Verify native conversion on macOS
        if: runner.os == 'macOS'
        run: python verify_release_native.py dist/LocalFileConverter.app/Contents/MacOS/LocalFileConverter
      - name: Include licenses on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md -Destination dist/LocalFileConverter
          Copy-Item THIRD_PARTY_LICENSES -Destination dist/LocalFileConverter -Recurse
      - name: Include licenses on macOS
        if: runner.os == 'macOS'
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md dist/LocalFileConverter.app/Contents/Resources/
          cp -R THIRD_PARTY_LICENSES dist/LocalFileConverter.app/Contents/Resources/
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath dist/LocalFileConverter -DestinationPath "LocalFileConverter-${{ matrix.name }}.zip"
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/LocalFileConverter.app "LocalFileConverter-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: LocalFileConverter-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.zip --repo "${GITHUB_REPOSITORY}" --title "FreeConvert ${GITHUB_REF_NAME}" --verify-tag --notes "Removes the bundled LibreOffice runtime. Basic DOCX, ODT, RTF, TXT, XLSX, ODS, CSV, PPTX, and ODP conversions now run within FreeConvert. Legacy DOC, XLS, and PPT conversion is not supported. Complex formatting, formulas, objects, and metadata may change; see README before converting important files." --generate-notes
