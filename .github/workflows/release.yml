name: Build desktop downloads

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: Windows-x64
          - os: macos-15-intel
            name: macOS-Intel
          - os: macos-15
            name: macOS-Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run checks
        run: python -m unittest -q
      - name: Install LibreOffice on Windows
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh -y --no-progress
      - name: Install LibreOffice on macOS
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice
      - name: Package app
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name LocalFileConverter --collect-all imageio_ffmpeg --collect-data rapidocr app.py
      - name: Bundle LibreOffice
        run: python bundle_office.py
      - name: Verify bundled LibreOffice on Windows
        if: runner.os == 'Windows'
        run: python verify_release_office.py dist/LocalFileConverter/LibreOffice/program/soffice.exe
      - name: Verify bundled LibreOffice on macOS
        if: runner.os == 'macOS'
        run: python verify_release_office.py dist/LocalFileConverter.app/Contents/Resources/LibreOffice.app/Contents/MacOS/soffice
      - name: Verify packaged OCR on Windows
        if: runner.os == 'Windows'
        run: python verify_release_ocr.py dist/LocalFileConverter/LocalFileConverter.exe
      - name: Verify packaged OCR on macOS
        if: runner.os == 'macOS'
        run: python verify_release_ocr.py dist/LocalFileConverter.app/Contents/MacOS/LocalFileConverter
      - name: Include licenses on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md -Destination dist/LocalFileConverter
          Copy-Item THIRD_PARTY_LICENSES -Destination dist/LocalFileConverter -Recurse
      - name: Include licenses on macOS
        if: runner.os == 'macOS'
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md dist/LocalFileConverter.app/Contents/Resources/
          cp -R THIRD_PARTY_LICENSES dist/LocalFileConverter.app/Contents/Resources/
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath dist/LocalFileConverter -DestinationPath "LocalFileConverter-${{ matrix.name }}.zip"
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/LocalFileConverter.app "LocalFileConverter-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: LocalFileConverter-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.zip --repo "${GITHUB_REPOSITORY}" --title "Local File Converter ${GITHUB_REF_NAME}" --verify-tag --notes "LibreOffice is now included in each desktop download for local Office conversions and the Office suite button, with no separate installation required. This does not add Final Draft-specific metadata or pagination support. See the README and third-party notices." --generate-notes
